name: Playwright Tests

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  playwright-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
      env:
        CI: true

    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-html-report
        path: playwright-report/
        retention-days: 30

    - name: Upload traces
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-traces
        path: test-results/**/trace*.zip
        retention-days: 30

    - name: Send Teams notification on failure
      if: failure()
      run: |
        curl -X POST ${{ secrets.TEAMS_WEBHOOK_URL }} \
          -H 'Content-Type: application/json' \
          -d '{
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "contentUrl": null,
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "❌ Playwright Tests Failed",
                      "weight": "bolder",
                      "size": "large",
                      "color": "attention"
                    },
                    {
                      "type": "FactSet",
                      "facts": [
                        {
                          "name": "PR Title:",
                          "value": "${{ github.event.pull_request.title }}"
                        },
                        {
                          "name": "Author:",
                          "value": "${{ github.event.pull_request.user.login }}"
                        },
                        {
                          "name": "Branch:",
                          "value": "${{ github.head_ref }}"
                        }
                      ]
                    }
                  ],
                  "actions": [
                    {
                      "type": "Action.OpenUrl",
                      "title": "View Failed Run",
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              }
            ]
          }'

    - name: Fetch previous test history from gh-pages
      if: always() && github.ref == 'refs/heads/main'
      run: |
        mkdir -p .gh-pages-temp
        git fetch origin gh-pages --depth=1 2>/dev/null || echo "gh-pages branch does not exist yet"
        if git show origin/gh-pages:test-history.json > .gh-pages-temp/history.json 2>/dev/null; then
          echo "Previous history found"
        else
          echo "[]" > .gh-pages-temp/history.json
        fi

    - name: Update test history
      if: always() && github.ref == 'refs/heads/main'
      run: |
        TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        COMMIT_SHA="${{ github.sha }}"
        BRANCH="${{ github.ref_name }}"
        JOB_CONCLUSION="${{ job.status }}"
        
        NEW_ENTRY=$(jq -n \
          --arg ts "$TIMESTAMP" \
          --arg url "$RUN_URL" \
          --arg sha "$COMMIT_SHA" \
          --arg branch "$BRANCH" \
          --arg conclusion "$JOB_CONCLUSION" \
          '{timestamp: $ts, run_url: $url, commit_sha: $sha, branch: $branch, conclusion: $conclusion}')
        
        UPDATED_HISTORY=$(jq ". += [$NEW_ENTRY]" .gh-pages-temp/history.json)
        
        mkdir -p playwright-report
        echo "$UPDATED_HISTORY" > playwright-report/test-history.json
        echo "Updated history: $UPDATED_HISTORY"

    - name: Upload pages artifact
      if: always() && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: playwright-report/

    - name: Deploy to GitHub Pages
      if: always() && github.ref == 'refs/heads/main'
      id: deployment
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      uses: actions/deploy-pages@v4

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: |
        npm audit --audit-level=high > audit-report.txt 2>&1 || true
        AUDIT_OUTPUT=$(cat audit-report.txt)
        echo "## Dependency Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### npm audit Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "$AUDIT_OUTPUT" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        npm audit --audit-level=high